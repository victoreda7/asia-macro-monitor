name: Coleta Asia Macro News

# Quem dita o ritmo é o cron-job.org: a cada 10 min ele chama
# /api/coletar no painel da Vercel, que dispara este workflow
# (workflow_dispatch). O agendador do próprio GitHub ficou só de reserva — em
# set/2026 ele rodava ~6 vezes por dia em vez de 144, com buracos de até 8 h.
# O botão "Atualizar agora" do painel web também entra por workflow_dispatch.
on:
  schedule:
    - cron: "7,37 * * * *"   # reserva, caso o cron-job.org pare
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false  # nunca dois fetch ao mesmo tempo; enfileira em vez de cancelar

permissions:
  contents: write  # o job precisa commitar o feed.json atualizado de volta no repo

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ref: main de propósito. Sem isso o checkout pega o commit de quando o
      # disparo foi feito; uma run que ficou na fila atrás de outra partia de
      # um feed velho e conflitava no push (aconteceu em 28/09).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Projeto é Python puro (stdlib only) — sem requirements.txt, sem pip install.
      - name: Coletar notícias
        run: python3 "Código/fetch_asia_news.py"

      # Prompt de curadoria na versão do painel web (a IA devolve o JSON no
      # chat, a pessoa cola no painel). Sai com as estatísticas desta coleta.
      - name: Gerar prompt de curadoria
        run: python3 "Código/build_prompt.py" --web --saida "Cache/prompt_curadoria.md"

      - name: Commitar e enviar o feed atualizado
        run: |
          git config user.name "asia-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "Cache/feed.json" "Cache/translation_cache.json" "Cache/first_seen_cache.json" "Cache/prompt_curadoria.md" "Monitor de Notícias Macro.html"
          if git diff --cached --quiet; then
            echo "sem mudanças desde a última coleta"
          else
            git commit -m "coleta automática $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            # O painel pode ter commitado a curadoria (manual_additions.json)
            # enquanto esta coleta rodava: rebase antes de enviar. Se outra
            # coleta tiver mexido nos mesmos arquivos gerados, vale a desta
            # (-X theirs = o commit sendo reaplicado), que é a mais nova.
            for tentativa in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi
